<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Soumaya ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            color: white;
            max-width: 700px;
            padding: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 45px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        #oui {
            background-color: #4CAF50;
            color: white;
            position: static;
        }

        #oui:hover {
            transform: scale(1.1);
            background-color: #45a049;
        }

        #non {
            background-color: #f44336;
            color: white;
            position: fixed;
        }

        /* Message après "Oui" */
        .love-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: linear-gradient(
                135deg,
                rgba(255, 117, 140, 0.97),
                rgba(255, 126, 179, 0.97)
            );

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;
            font-weight: bold;
            text-align: center;

            opacity: 0;
            visibility: hidden;

            transition: 0.5s;
            flex-direction: column;
        }

        .love-message.show {
            opacity: 1;
            visibility: visible;
            animation: zoom 0.8s ease;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1s infinite;
        }

        @keyframes zoom {
            from {
                transform: scale(0.5);
            }

            to {
                transform: scale(1);
            }
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            Soumaya ❤️<br><br>

            I have a very important question for you... 😏<br><br>

            Do you love me? ❤️<br><br>

            J'ai tout fait pour que tu n'arrives jamais à cliquer sur
            <strong>NO</strong> hahaha 😈
        </h1>

        <div class="buttons">

            <button id="oui">
                YES ❤️
            </button>

            <button id="non">
                NO 😅
            </button>

        </div>

    </div>


    <!-- Message romantique -->

    <div id="loveMessage" class="love-message">

        <div class="heart">
            ❤️
        </div>

        <div>
            Hta ana knbghiik bb ❤️
        </div>

        <div class="heart">
            💕
        </div>

    </div>


    <script>

        const nonBtn = document.getElementById("non");
        const ouiBtn = document.getElementById("oui");
        const loveMessage = document.getElementById("loveMessage");


        /*
         * Make the NO button impossible to click.
         */

        function moveButton() {

            const maxX =
                window.innerWidth - nonBtn.offsetWidth - 10;

            const maxY =
                window.innerHeight - nonBtn.offsetHeight - 10;


            const randomX =
                Math.max(10, Math.random() * maxX);

            const randomY =
                Math.max(10, Math.random() * maxY);


            nonBtn.style.left = randomX + "px";

            nonBtn.style.top = randomY + "px";


            const rotation =
                (Math.random() * 60) - 30;

            nonBtn.style.transform =
                "rotate(" + rotation + "deg)";
        }


        /*
         * Move when Soumaya tries to approach/click NO.
         */

        nonBtn.addEventListener(
            "mouseenter",
            moveButton
        );

        nonBtn.addEventListener(
            "mouseover",
            moveButton
        );

        nonBtn.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                moveButton();

            }
        );


        /*
         * Initial position.
         */

        moveButton();


        /*
         * YES button.
         */

        ouiBtn.addEventListener(
            "click",
            function() {

                loveMessage.classList.add("show");

            }
        );

    </script>

</body>
</html>
