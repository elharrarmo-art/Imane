<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Question spéciale ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            color: white;
            max-width: 700px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            position: absolute;
        }

        #oui {
            position: static;
            background-color: #4CAF50;
            color: white;
        }

        #non {
            background-color: #f44336;
            color: white;
        }

        /* Message plein écran */
        .love-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.5s;
            flex-direction: column;
        }

        .love-message.show {
            opacity: 1;
            visibility: visible;
            animation: zoom 0.8s ease;
        }

        @keyframes zoom {
            from { transform: scale(0.5); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            Hbiba imane ana mohamed, j'ai une question... ❤️ <br><br>
            Tu m’aimes ? 😏 <br><br>
            J’ai tout fait pour que tu n’arrives jamais à cliquer sur non hahaha 😈
        </h1>

        <button id="oui">Oui ❤️</button>
        <button id="non">Non 😅</button>
    </div>

    <!-- Message romantique -->
    <div id="loveMessage" class="love-message">
        💖💖💖<br>
        O ana knmout 3lik hbiba 😍❤️🔥<br>
        💕💕💕
    </div>

    <script>
        const nonBtn = document.getElementById("non");
        const ouiBtn = document.getElementById("oui");
        const loveMessage = document.getElementById("loveMessage");

        function moveButton() {
            const maxX = window.innerWidth - nonBtn.offsetWidth;
            const maxY = window.innerHeight - nonBtn.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            nonBtn.style.left = randomX + "px";
            nonBtn.style.top = randomY + "px";
            nonBtn.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
        }

        nonBtn.addEventListener("mouseover", moveButton);
        nonBtn.addEventListener("click", moveButton);
        moveButton();

        ouiBtn.addEventListener("click", function() {
            loveMessage.classList.add("show");
        });
    </script>

</body>
</html>
